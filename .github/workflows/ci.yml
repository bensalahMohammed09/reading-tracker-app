name: CI Pipeline 

on:
  push:
    branches: [ "main" ]
  pull_request: 
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: set lowercase owner name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}  
        

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} 

      - name: Build and push .NET API 
        uses: docker/build-push-action@v5
        with:
          context: ./backend/ReadingTracker.API
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-api:${{ github.sha }},${{ env.REGISTRY }}/${{ env.REPO_LC }}-api:latest

      - name: Build and push React Web
        uses: docker/build-push-action@v5
        with:
          context: ./frontend/web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REPO_LC }}-web:${{ github.sha }},${{ env.REGISTRY }}/${{ env.REPO_LC }}-web:latest    